spring.application.name=VetTurno
spring.config.import=optional:file:./config/application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetturno?connectionTimeZone=America/Bogota}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=America/Bogota

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT1H
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
springdoc.swagger-ui.persist-authorization=false
