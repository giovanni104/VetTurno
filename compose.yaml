# MySQL local solicitado por el estudiante. La API se ejecuta con Java 17 fuera de Docker.
services:
  mysql:
    image: mysql:8.4.11
    container_name: vetturno-mysql
    restart: unless-stopped
    env_file:
      - .local/mysql.env
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - vetturno-mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  vetturno-mysql-data:
    name: vetturno-mysql-data
